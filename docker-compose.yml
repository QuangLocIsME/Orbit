version: '3.9'

services:
  redis:
    image: redis:7-alpine
    container_name: orbit-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: orbit-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  minio:
    image: minio/minio:latest
    container_name: orbit-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: "12345678"
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  ifc-worker:
    image: node:20-alpine
    container_name: orbit-ifc-worker
    restart: unless-stopped
    working_dir: /app/Backend
    volumes:
      - ./:/app
    extra_hosts:
      - host.docker.internal:host-gateway
    env_file:
      - ./Backend/.env
    environment:
      - MONGODB_URI=mongodb://host.docker.internal:27017/Orbit
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    command: sh -c "npm install && sed -i 's|btoa.node|btoa.node.js|g' node_modules/@loaders.gl/polyfills/dist/index.js && node workers/ifcConversionWorker.js"
    depends_on:
      - rabbitmq

volumes:
  redis-data:
  minio-data:
